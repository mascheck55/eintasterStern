[platformio]
default_envs = Upload_UPDI

[env]
platform = atmelmegaavr
board = ATtiny412
framework = arduino

; megaTinyCore
platform_packages =
    framework-arduino-megaavr-megatinycore@https://github.com/SpenceKonde/megaTinyCore

; CPU-Takt
board_build.f_cpu = 1000000L
board_hardware.oscillator = internal

; UPDI-Schnittstelle
upload_protocol = jtag2updi
;upload_protocol = serialupdi
upload_port = /dev/ttyUSB0
upload_speed = 115200

[env:Upload_UPDI]

[env:set_fuses]
upload_protocol = ${env:Upload_UPDI.upload_protocol}

; Fuse-Einstellungen
board_hardware.bod = disabled
board_hardware.eesave = yes
board_hardware.rstpin = updi
